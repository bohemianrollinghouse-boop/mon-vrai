# Configuration Firebase App Hosting (Cloud Run en coulisse).
#
# minInstances: 1 évite les démarrages à froid sur la première visite et, surtout,
# garantit qu'un webhook Stripe trouve toujours une instance prête. Quelques euros
# par mois, pour ne jamais perdre un paiement pendant un réveil.
#
# Les secrets ne sont jamais ici : ils vivent dans Secret Manager et sont
# référencés par nom. Voir .env.example pour la liste.
runConfig:
  minInstances: 1
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Domaine public (liens des e-mails, retour Stripe, métadonnées). DNS basculé le 2026-09-08.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://monvrai.fr
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mon-vrai
    availability: [BUILD, RUNTIME]

  # Config Web Firebase : publique par nature (protégée par les règles et les domaines autorisés).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAkl9L0g1NbneX-2XztzyovkT7MftVQY5I
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: mon-vrai.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET

  # Clés publiables Stripe (publiques). La clé live (pk_live_…) est à ajouter ici :
  #   - variable: STRIPE_PUBLISHABLE_KEY
  #     value: pk_live_…
  # Sans elle, la page de paiement en mode production affiche « paiement non activé ».
  - variable: STRIPE_PUBLISHABLE_KEY_TEST
    value: pk_test_51QmyvXEg6em054QIHhvvnmWG3mtxsG10LRiFbRKupXcSwEu33hWnoAWxebSbvBWDb0De0OT2wJPOJBOxhfGcY87G00FVddjT9s

  # Clés du mode TEST Stripe : utilisées quand l'admin bascule « Paiements en mode test ».
  - variable: STRIPE_SECRET_KEY_TEST
    secret: STRIPE_SECRET_KEY_TEST

  - variable: STRIPE_WEBHOOK_SECRET_TEST
    secret: STRIPE_WEBHOOK_SECRET_TEST

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  - variable: EMAIL_FROM
    value: "Mon Vrai <bonjour@monvrai.fr>"

  - variable: CONTACT_INBOX
    value: contact@monvrai.fr

  # Passer à "1" une fois Stripe Tax activé dans le tableau de bord Stripe.
  - variable: STRIPE_TAX
    value: "0"

  - variable: FIREBASE_STORAGE_BUCKET
    value: mon-vrai.firebasestorage.app
    availability: [BUILD, RUNTIME]
