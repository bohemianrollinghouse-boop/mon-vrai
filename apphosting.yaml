# Configuration Firebase App Hosting (Cloud Run en coulisse).
#
# minInstances: 1 évite les démarrages à froid sur la première visite et, surtout,
# garantit qu'un webhook Stripe trouve toujours une instance prête. Quelques euros
# par mois, pour ne jamais perdre un paiement pendant un réveil.
#
# Les secrets ne sont jamais ici : ils vivent dans Secret Manager et sont
# référencés par nom. Voir .env.example pour la liste.
runConfig:
  minInstances: 1
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Domaine public (liens des e-mails, retour Stripe, métadonnées). DNS basculé le 2026-09-08.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://monvrai.fr
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mon-vrai
    availability: [BUILD, RUNTIME]

  # Config Web Firebase : publique par nature (protégée par les règles et les domaines autorisés).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAkl9L0g1NbneX-2XztzyovkT7MftVQY5I
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: mon-vrai.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET

  # Clés publiables Stripe (publiques par nature).
  - variable: STRIPE_PUBLISHABLE_KEY
    value: pk_live_51QmyvXEg6em054QI4WRrbQDYrmAiO1lxACfOP1krePlscGztMFhjBqNLXjlwU2l7qtLL0lEsYmZQPu84sOOyKQYw00fkzkn7MH

  - variable: STRIPE_PUBLISHABLE_KEY_TEST
    value: pk_test_51QmyvXEg6em054QIHhvvnmWG3mtxsG10LRiFbRKupXcSwEu33hWnoAWxebSbvBWDb0De0OT2wJPOJBOxhfGcY87G00FVddjT9s

  # Configuration des moyens de paiement (dashboard Stripe → Payment methods).
  # Elle décide des moyens proposés à la caisse (carte, Apple/Google Pay, Link, PayPal…).
  # Propre au mode : une configuration par mode (les ids diffèrent entre test et live).
  - variable: STRIPE_PMC_ID
    value: pmc_1UDYbnEg6em054QINyqH3xRD

  - variable: STRIPE_PMC_ID_TEST
    value: pmc_1Qmyw2Eg6em054QIe52y77OO

  # Clés du mode TEST Stripe : utilisées quand l'admin bascule « Paiements en mode test ».
  - variable: STRIPE_SECRET_KEY_TEST
    secret: STRIPE_SECRET_KEY_TEST

  - variable: STRIPE_WEBHOOK_SECRET_TEST
    secret: STRIPE_WEBHOOK_SECRET_TEST

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  # Boxtal : expéditions (API v3), carte des points relais, signature des webhooks.
  - variable: BOXTAL_ACCESS_KEY
    secret: BOXTAL_ACCESS_KEY

  - variable: BOXTAL_SECRET_KEY
    secret: BOXTAL_SECRET_KEY

  - variable: BOXTAL_MAP_ACCESS_KEY
    secret: BOXTAL_MAP_ACCESS_KEY

  - variable: BOXTAL_MAP_SECRET_KEY
    secret: BOXTAL_MAP_SECRET_KEY

  - variable: BOXTAL_WEBHOOK_SECRET
    secret: BOXTAL_WEBHOOK_SECRET

  # Boxtal — environnement de test (bac à sable api.boxtal.build), utilisé quand la
  # boutique est en mode test : étiquettes non facturées. Voir lib/boxtal/client.ts.
  - variable: BOXTAL_ACCESS_KEY_TEST
    secret: BOXTAL_ACCESS_KEY_TEST

  - variable: BOXTAL_SECRET_KEY_TEST
    secret: BOXTAL_SECRET_KEY_TEST

  - variable: BOXTAL_WEBHOOK_SECRET_TEST
    secret: BOXTAL_WEBHOOK_SECRET_TEST

  - variable: EMAIL_FROM
    value: "Mon Vrai <no-reply@monvrai.fr>"

  - variable: CONTACT_INBOX
    value: contact@monvrai.fr

  # Passer à "1" une fois Stripe Tax activé dans le tableau de bord Stripe.
  - variable: STRIPE_TAX
    value: "0"

  - variable: FIREBASE_STORAGE_BUCKET
    value: mon-vrai.firebasestorage.app
    availability: [BUILD, RUNTIME]

  # Make Webhook
  - variable: MAKE_WEBHOOK_URL
    secret: MAKE_WEBHOOK_URL
  - variable: MAKE_WEBHOOK_API_KEY
    secret: MAKE_WEBHOOK_API_KEY
