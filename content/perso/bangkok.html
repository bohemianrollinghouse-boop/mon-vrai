<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>
:root{
  --bg:#f3f2f7;--card:#ffffff;--ink:#14121f;--soft:#3d3a4f;--mute:#6b6880;--line:#e3e1ea;--well:#e6e4ee;
  --violet:#5b4bff;--violet-ink:#3a2bc0;--violet-wash:#ece9ff;--jour:#ffb020;--nuit:#5b4bff;--deux:#ff4d8d;--alert:#c4204f;
  --land:#e9e7f1;--btn:#14121f;--btn-ink:#ffffff;--shadow:rgba(20,18,31,.16);--tile-filter:saturate(.85);
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--f-code:"Space Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0e16;--card:#1a1825;--ink:#f1f0f7;--soft:#cfcde0;--mute:#9a97ad;--line:#2c2a3a;--well:#232131;
  --violet:#7d70ff;--violet-ink:#b3abff;--violet-wash:#26214d;--jour:#ffb84d;--nuit:#7d70ff;--deux:#ff6aa0;--alert:#ff7a9c;
  --land:#191724;--btn:#f1f0f7;--btn-ink:#14121f;--shadow:rgba(0,0,0,.5);--tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.7);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}

.eyebrow{font-size:13px;font-weight:600;color:var(--mute)}
h1{margin:2px 0 0;font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--well);border-radius:14px}
.seg button{height:40px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-jour{background:var(--jour)}.d-nuit{background:var(--nuit)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}

.mapwrap{position:relative;height:280px;border-radius:24px;overflow:hidden;background:var(--land)}
#map{position:absolute;inset:0;background:var(--land);font:inherit}
#map .leaflet-tile-pane{filter:var(--tile-filter)}
#map .leaflet-control-attribution{font-size:10px;color:var(--mute);background:var(--card);opacity:.92;border-top-left-radius:8px}
#map .leaflet-control-attribution a{color:var(--mute)}
.zoomsw{position:absolute;top:10px;right:10px;z-index:1100;display:flex;gap:2px;padding:3px;background:var(--card);border-radius:11px;box-shadow:0 1px 4px var(--shadow)}
.zoomsw button{height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:12px;cursor:pointer}
.zoomsw button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.locate{position:absolute;top:10px;left:10px;z-index:1100;height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:0;border-radius:11px;background:var(--card);box-shadow:0 1px 4px var(--shadow);font-weight:700;font-size:12px;cursor:pointer}
.locate svg{width:15px;height:15px}
.locate.on{background:#1a73e8;color:#fff}
.sheet{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(20,18,31,.45);animation:fade .18s ease}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:420px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border-radius:24px;box-shadow:0 20px 50px var(--shadow);animation:pop .2s ease}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.sh{display:flex;align-items:center;gap:12px}
.sh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sh h2{margin:0;font-size:18px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.sh .meta{font-size:13px;font-weight:500;color:var(--mute)}
.x{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--bg);color:var(--mute);cursor:pointer}
.x svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.sheet,.panel{animation:none}}
.pin{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(20,18,31,.35);width:100%;height:100%}
.p-jour{background:var(--jour)}.p-nuit{background:var(--nuit)}.p-deux{background:var(--deux)}
.pin.on{box-shadow:0 0 0 5px rgba(91,75,255,.3),0 4px 12px rgba(20,18,31,.35)}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}

.lh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0}
.lh h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.lh span{font-size:13px;color:var(--mute)}
#list{display:flex;flex-direction:column;gap:10px}
.empty{padding:28px 18px;text-align:center;background:var(--card);border-radius:22px;color:var(--mute)}
.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border-radius:22px;border:2px solid var(--card)}
.card.on{border-color:var(--violet)}
.head{display:flex;align-items:center;gap:12px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.num{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;font:700 14px var(--f-code);color:#14121f}
.num.nuit{color:#fff}
.num.sm{width:34px;height:34px;border-radius:10px;font-size:12px}
.n-jour{background:var(--jour)}.n-nuit{background:var(--nuit)}.n-deux{background:var(--deux)}
.head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.head .name{font-size:16px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.head .meta{font-size:13px;font-weight:500;color:var(--mute)}
.desc{margin:0;font-size:14px;color:var(--soft);overflow-wrap:anywhere}
.hrs{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--mute);font-weight:500}
.hrs.alert{color:var(--alert);font-weight:700}
.hrs svg{flex:none;width:15px;height:15px;margin-top:2px}
.nopin{margin:0;font-size:12px;font-style:italic;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{height:34px;display:inline-flex;align-items:center;padding:0 13px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none}
.links .vid{background:var(--violet-wash);color:var(--violet-ink)}
.links .site{background:var(--well);color:var(--ink)}
.links .y{background:var(--btn);color:var(--btn-ink)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{u=String(u||'').trim();return /^https:\/\/\S+$/i.test(u)?u:'';};
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const goUrl=p=>safe(p.m)||gm(p.q||p.n+' Bangkok');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LAB={jour:'Jour',nuit:'Nuit',deux:'Jour et nuit'};
const code=n=>String(n||0).padStart(2,'0');
const BOX={centre:[[13.695,100.475],[13.785,100.615]],tout:[[13.64,100.39],[13.84,100.70]]};
const ITEMS=PLACES.map((p,k)=>Object.assign({id:'l'+(p.num||k+1)},p,{ll:Array.isArray(p.ll)&&p.ll.length===2?p.ll:null}));
const TYPES=(()=>{const s=new Set(['Sensations','Fête','Food','Immersif','Spectacle','Balade']);ITEMS.forEach(p=>p.t&&s.add(p.t));return [...s];})();

let W='tous',T='Tout',SEL=null;
try{const s=JSON.parse(localStorage.getItem('bkk-filtres')||'{}');if(['tous','jour','nuit'].includes(s.W))W=s.W;if(typeof s.T==='string')T=s.T;}catch(e){}

const map=L.map('map',{zoomControl:false,zoomSnap:.25,zoomAnimation:!calm,fadeAnimation:!calm,markerZoomAnimation:!calm});
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">contributeurs OpenStreetMap</a>'}).addTo(map);
const fit=z=>map.fitBounds(BOX[z],{animate:!calm,padding:[4,4]});
const pins=L.layerGroup().addTo(map);
fit('centre');

const ok=p=>(W==='tous'||p.w===W||p.w==='deux')&&(T==='Tout'||(T==='Ma collection'?p.c:p.t===T));
const clock='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const numCls=p=>'num n-'+esc(p.w)+(p.w==='nuit'?' nuit':'');
function linksHtml(p){
  const v=safe(p.v),v2=safe(p.v2),s=safe(p.s);
  return '<div class="links">'+(v?'<a class="vid" href="'+esc(v)+'" target="_blank" rel="noopener">Vidéo</a>':'')+(v2?'<a class="vid" href="'+esc(v2)+'" target="_blank" rel="noopener">2e vidéo</a>':'')+(s?'<a class="site" href="'+esc(s)+'" target="_blank" rel="noopener">Site</a>':'')+'<a class="y" href="'+esc(goUrl(p))+'" target="_blank" rel="noopener">Y aller</a></div>';
}
function paintFilters(){
  $('#fWhen').innerHTML=[['tous','Tout',''],['jour','Jour','d-jour'],['nuit','Nuit','d-nuit']].map(([v,l,d])=>'<button type="button" data-v="'+v+'" aria-pressed="'+(v===W)+'">'+(d?'<span class="dot '+d+'" aria-hidden="true"></span>':'')+l+'</button>').join('');
  const ts=['Tout','Ma collection'].concat(TYPES);
  if(!ts.includes(T))T='Tout';
  $('#fType').innerHTML=ts.map(x=>'<button type="button" data-v="'+esc(x)+'" aria-pressed="'+(x===T)+'">'+esc(x)+'</button>').join('');
}
function render(){
  paintFilters();
  const vis=ITEMS.filter(ok);
  $('#listTitle').textContent=T==='Tout'?'Toutes les idées':T;
  $('#count').textContent=vis.length+' lieux';
  $('#eyebrow').textContent='กรุงเทพฯ · '+ITEMS.length+' idées';
  $('#list').innerHTML=vis.length?vis.map(p=>'<article class="card'+(p.id===SEL?' on':'')+'" data-id="'+esc(p.id)+'">'+
    '<button type="button" class="head" data-pick="'+esc(p.id)+'"><span class="'+numCls(p)+'">'+code(p.num)+'</span><span class="t"><span class="name">'+esc(p.n)+'</span><span class="meta">'+(p.c?'Ma collection · ':'')+esc(p.t||'')+(p.t?' · ':'')+esc(LAB[p.w]||'')+'</span></span></button>'+
    (p.d?'<p class="desc">'+esc(p.d)+'</p>':'')+
    (p.h?'<div class="hrs'+(p.a?' alert':'')+'">'+clock+'<span>'+esc(p.h)+'</span></div>':'')+
    (p.ll?'':'<p class="nopin">Pas de point sur la carte.</p>')+
    linksHtml(p)+'</article>').join(''):'<div class="empty"><strong>Rien avec ces filtres</strong>Essaie « Tout ».</div>';
  pins.clearLayers();
  vis.forEach(p=>{if(!p.ll)return;
    const on=p.id===SEL,s=on?26:16;
    L.marker(p.ll,{title:p.n,zIndexOffset:on?1000:0,icon:L.divIcon({className:'',html:'<div class="pin p-'+esc(p.w)+(on?' on':'')+'"></div>',iconSize:[s,s],iconAnchor:[s/2,s/2]})})
      .on('click',()=>openSheet(p.id)).addTo(pins);});
  try{localStorage.setItem('bkk-filtres',JSON.stringify({W:W,T:T}));}catch(e){}
}
const sheet=$('#sheet');
function openSheet(id){
  const p=ITEMS.find(x=>x.id===id);if(!p)return;
  SEL=id;render();
  sheet.innerHTML='<div class="panel">'+
    '<div class="sh"><span class="'+numCls(p)+'">'+code(p.num)+'</span><span class="t"><h2 id="sheetTitle">'+esc(p.n)+'</h2><span class="meta">'+(p.c?'Ma collection · ':'')+esc(p.t||'')+(p.t?' · ':'')+esc(LAB[p.w]||'')+'</span></span>'+
    '<button type="button" class="x" id="sheetClose" aria-label="Fermer la fiche"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
    (p.d?'<p class="desc">'+esc(p.d)+'</p>':'')+
    (p.h?'<div class="hrs'+(p.a?' alert':'')+'">'+clock+'<span>'+esc(p.h)+'</span></div>':'')+
    linksHtml(p)+'</div>';
  sheet.hidden=false;
  $('#sheetClose').onclick=closeSheet;
  $('#sheetClose').focus({preventScroll:true});
}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet();});
map.on('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
function setZ(z){document.querySelectorAll('.zoomsw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===z));fit(z);}
function select(id,fromList){
  SEL=id;render();
  const p=ITEMS.find(x=>x.id===id);
  if(fromList&&p&&p.ll){
    map.flyTo(p.ll,Math.max(map.getZoom(),15),{animate:!calm,duration:.7});
    document.querySelectorAll('.zoomsw button').forEach(b=>b.setAttribute('aria-pressed','false'));
    window.scrollTo({top:0,behavior:calm?'auto':'smooth'});
  }else{
    const el=document.querySelector('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
    if(el)el.scrollIntoView({block:'center',behavior:calm?'auto':'smooth'});
  }
}
$('#fWhen').onclick=e=>{const b=e.target.closest('button');if(!b)return;W=b.dataset.v;render();};
$('#fType').onclick=e=>{const b=e.target.closest('button');if(!b)return;T=b.dataset.v;render();};
document.querySelector('.zoomsw').onclick=e=>{const b=e.target.closest('button');if(b)setZ(b.dataset.z);};
$('#list').onclick=e=>{const pk=e.target.closest('[data-pick]');if(pk)select(pk.dataset.pick,true);};

/* Localisation : le premier appui demande l'autorisation puis suit la position en continu ;
   les appuis suivants recentrent la carte sur toi. */
let me=null,meRing=null,watching=false,last=null;
const locBtn=$('#locate'),locLabel=t=>{locBtn.lastChild.textContent=t;};
function centerOnMe(){if(!last)return;map.flyTo(last,Math.max(map.getZoom(),15),{animate:!calm});document.querySelectorAll('.zoomsw button').forEach(b=>b.setAttribute('aria-pressed','false'));}
locBtn.onclick=()=>{
  if(!navigator.geolocation){locLabel('Pas de GPS');return;}
  if(watching){centerOnMe();return;}
  watching=true;locLabel('Recherche…');
  let first=true;
  navigator.geolocation.watchPosition(pos=>{
    last=[pos.coords.latitude,pos.coords.longitude];
    if(me){me.setLatLng(last);meRing.setLatLng(last).setRadius(pos.coords.accuracy);}
    else{
      meRing=L.circle(last,{radius:pos.coords.accuracy,color:'#1a73e8',weight:1,fillColor:'#1a73e8',fillOpacity:.12,interactive:false}).addTo(map);
      me=L.marker(last,{interactive:false,keyboard:false,zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    }
    locBtn.classList.add('on');locLabel('Moi');
    if(first){first=false;centerOnMe();}
  },err=>{
    watching=false;locBtn.classList.remove('on');
    locLabel(err.code===1?'Localisation refusée':'Position introuvable');
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};
render();
})();
</script>
</body>
</html>
